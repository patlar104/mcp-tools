name: Bug report
description: Report incorrect behavior in the downloader foundation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Include commands, inputs, and the expected result.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include OS and Rust toolchain details.
    validations:
      required: true
